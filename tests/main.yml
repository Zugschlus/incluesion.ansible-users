---

- hosts: all
  become: yes
  roles:
    - weareinteractive.users
  vars:
    users:
      - username: root
        home: /root
        group: root
        authorized_keys:
          - "{{ lookup('file', 'tests/id_rsa.pub') }}"
        user_create: no
      - username: foobar
        name: Foo Bar 1
      - username: foobar_authorized_keys
        authorized_keys:
          - "{{ lookup('file', 'tests/id_rsa.pub') }}"
        home_create: yes
      - username: foobar_nohome
        home_create: no
      - username: foobar_groups
        groups:
          - users
        append: yes
      - username: foobar_groups_reset
        groups: []
        group: foobar_groups_reset
      - username: foobar_home_mode
        home_mode: "0750"
      - username: foobar_key
        ssh_key: "{{ lookup('file', 'tests/id_rsa') }}"
      - username: foobar_keys
        ssh_keys:
          id_rsa_1: "{{ lookup('file', 'tests/id_rsa') }}"
          id_rsa_2: "{{ lookup('file', 'tests/id_rsa') }}"
      - username: foobar_key_generate
        ssh_key_generate: yes
        ssh_key_password: secret
      - username: foobar_system
        system: yes
      - username: foobar_file
        home_files:
          - "tests/.bashrc"
      - username: foobar_random_password
        random_password: true
      - username: foobar_update_always
        update_user: always
      - username: foobar_shell
        shell: /bin/sh
      - username: foobar_custom_home
        home: /tmp/foobar_custom_home
    users_group: staff
    users_groups:
      - www-data
    users_authorized_keys_exclusive: yes
    users_remove:
    - foobar
    - { username: foobar_key, remove: no }
    - { username: foobar_authorized_keys, remove: yes }

- hosts: all
  become: yes
  tasks:
    - name: Verify foobar_random_password password file exists
      ansible.builtin.stat:
        path: /home/foobar_random_password/password
      register: pw_file

    - name: Assert password file has correct permissions and owner
      ansible.builtin.assert:
        that:
          - pw_file.stat.exists
          - pw_file.stat.mode == '0600'
          - pw_file.stat.pw_name == 'foobar_random_password'

    - name: Verify foobar_shell shell via getent
      ansible.builtin.getent:
        database: passwd
        key: foobar_shell

    - name: Assert foobar_shell has /bin/sh
      ansible.builtin.assert:
        that: ansible_facts.getent_passwd['foobar_shell'][5] == '/bin/sh'

    - name: Verify foobar_custom_home directory exists at custom path
      ansible.builtin.stat:
        path: /tmp/foobar_custom_home
      register: custom_home

    - name: Assert custom home is a directory
      ansible.builtin.assert:
        that: custom_home.stat.isdir

    - name: Verify foobar_nohome has no home directory
      ansible.builtin.stat:
        path: /home/foobar_nohome
      register: nohome_dir

    - name: Assert foobar_nohome home directory was not created
      ansible.builtin.assert:
        that: not nohome_dir.stat.exists
